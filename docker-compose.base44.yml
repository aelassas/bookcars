# Base44 development stack for the SafarRent monorepo.
# Every application service runs from the cloned source with live reload.
# Local infrastructure (MongoDB) is a plain compose service; Redis is optional
# and intentionally absent (the API degrades gracefully without it).
services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--quiet"]
    restart: on-failure
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { rs.status().ok } catch (error) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}).ok }' | grep -q 1",
        ]
      interval: 5s
      timeout: 10s
      retries: 40

  # One-shot dependency install + internal package build. App services wait for it.
  deps:
    image: node:22-bookworm-slim
    working_dir: /workspace
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
    command: ["sh", "/workspace/.base44/install-deps.sh"]

  api:
    image: node:22-bookworm-slim
    working_dir: /workspace/backend
    restart: on-failure
    depends_on:
      mongo:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    ports:
      - "4002:4002"
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
      - cdn:/var/www/cdn
    env_file:
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      BC_PORT: "4002"
      BC_HTTPS: "false"
      BC_DB_URI: "mongodb://mongo:27017/safarrent?replicaSet=rs0&directConnection=true"
      BC_DB_DEBUG: "false"
      # Redis is optional: point at a closed port so the client stays lazy.
      BC_REDIS_URL: "redis://127.0.0.1:6399"
      BC_AUTH_COOKIE_DOMAIN: ""
      BC_ADMIN_HOST: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}"
      BC_FRONTEND_HOST: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}"
      BC_BASE_CURRENCY: "PKR"
      BC_WEBSITE_NAME: "SafarRent"
      BC_MINIMUM_AGE: "21"
      BC_KYC_REQUIRED: "true"
      BC_AUTO_VERIFY_ON_SIGNUP: "true"
      BC_FYP_DEMO_MODE: "true"
      BC_ENABLE_FYP_DEMO: "true"
      BC_AI_PROVIDER: "mock"
      BC_AI_WARMUP_ON_START: "false"
      BC_CDN_ROOT: "/var/www/cdn"
      BC_CDN_USERS: "/var/www/cdn/bookcars/users"
      BC_CDN_TEMP_USERS: "/var/www/cdn/bookcars/temp/users"
      BC_CDN_CARS: "/var/www/cdn/bookcars/cars"
      BC_CDN_TEMP_CARS: "/var/www/cdn/bookcars/temp/cars"
      BC_CDN_LOCATIONS: "/var/www/cdn/bookcars/locations"
      BC_CDN_TEMP_LOCATIONS: "/var/www/cdn/bookcars/temp/locations"
      BC_CDN_CONTRACTS: "/var/www/cdn/bookcars/contracts"
      BC_CDN_TEMP_CONTRACTS: "/var/www/cdn/bookcars/temp/contracts"
      BC_CDN_LICENSES: "/var/www/cdn/bookcars/licenses"
      BC_CDN_TEMP_LICENSES: "/var/www/cdn/bookcars/temp/licenses"
      BASE44_PREVIEW_MODE: "${BASE44_PREVIEW_MODE:-}"
    command: ["sh", "-ec", "exec npm run dev:local"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4002/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    image: node:22-bookworm-slim
    working_dir: /workspace/frontend
    restart: on-failure
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "3000:8080"
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
    environment:
      VITE_PORT: "8080"
      VITE_BC_API_PROXY_TARGET: "http://api:4002"
      VITE_BC_API_HOST: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}"
      VITE_BC_ADMIN_HOST: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}"
      VITE_BC_API_SAME_HOST: "false"
      VITE_BC_FYP_DEMO_MODE: "true"
      VITE_BC_BASE_CURRENCY: "PKR"
      VITE_BC_CDN_USERS: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/users"
      VITE_BC_CDN_CARS: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/cars"
      VITE_BC_CDN_LOCATIONS: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/locations"
      VITE_BC_CDN_LICENSES: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/licenses"
      VITE_BC_CDN_TEMP_LICENSES: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/temp/licenses"
      BASE44_PREVIEW_MODE: "${BASE44_PREVIEW_MODE:-}"
      BASE44_SANDBOX_HOST_DOMAIN: "${BASE44_SANDBOX_HOST_DOMAIN:-}"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "${BASE44_SANDBOX_HOST_DOMAIN:-}"
      CHOKIDAR_USEPOLLING: "true"
    labels:
      base44.project: "Customer Web Portal"
      base44.kind: "web"
      base44.port: "3000"
    command: ["sh", "-ec", "exec npm run dev:local"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  admin:
    image: node:22-bookworm-slim
    working_dir: /workspace/admin
    restart: on-failure
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "3001:3001"
    volumes:
      - "${BASE44_PROJECT_ROOT}:/workspace"
    environment:
      VITE_PORT: "3001"
      VITE_BC_API_PROXY_TARGET: "http://api:4002"
      VITE_BC_API_HOST: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}"
      VITE_BC_FRONTEND_HOST: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}"
      VITE_BC_API_SAME_HOST: "false"
      VITE_BC_CURRENCY: "PKR"
      VITE_BC_COUNTRY: "Pakistan"
      VITE_BC_TIMEZONE: "Asia/Karachi"
      VITE_BC_CDN_USERS: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/users"
      VITE_BC_CDN_TEMP_USERS: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/temp/users"
      VITE_BC_CDN_CARS: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/cars"
      VITE_BC_CDN_TEMP_CARS: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/temp/cars"
      VITE_BC_CDN_LOCATIONS: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/locations"
      VITE_BC_CDN_TEMP_LOCATIONS: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/temp/locations"
      VITE_BC_CDN_CONTRACTS: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/contracts"
      VITE_BC_CDN_TEMP_CONTRACTS: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/temp/contracts"
      VITE_BC_CDN_LICENSES: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/licenses"
      VITE_BC_CDN_TEMP_LICENSES: "https://3001-${BASE44_PUBLIC_HOST_SUFFIX}/cdn/bookcars/temp/licenses"
      BASE44_PREVIEW_MODE: "${BASE44_PREVIEW_MODE:-}"
      BASE44_SANDBOX_HOST_DOMAIN: "${BASE44_SANDBOX_HOST_DOMAIN:-}"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: "${BASE44_SANDBOX_HOST_DOMAIN:-}"
      CHOKIDAR_USEPOLLING: "true"
    labels:
      base44.project: "Operations Admin Portal"
      base44.kind: "web"
      base44.port: "3001"
    command: ["sh", "-ec", "exec npm run dev:local"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  mongo_data:
  cdn:
