name: loc

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CLOC_EXCLUDE_DIRS: 'node_modules,coverage,.github,.vscode,__scripts,__services,dist'
  CLOC_EXCLUDE_EXTS: 'md,txt'

jobs:
  loc_job:
    runs-on: ubuntu-latest
    name: Run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Calculate Lines of Code & Generate Badge
        shell: bash
        run: |
          mkdir -p output

          # Execute cloc in CSV output mode and extract the 5th column (code lines)
          LOC=$(cloc . \
            --exclude-dir="${CLOC_EXCLUDE_DIRS}" \
            --exclude-ext="${CLOC_EXCLUDE_EXTS}" \
            --not-match-f='package-lock.json|LICENSE|CITATION.cff|\.env|tsconfig\.tsbuildinfo' \
            --csv 2>/dev/null | awk -F',' 'END{print $5}')

          # Default to 0 if directory is empty or command returns no code lines
          LOC=${LOC:-0}

          echo "Total Lines of Code: $LOC"

          # Format output with comma separators for readability
          export LC_ALL=en_US.UTF-8
          LOC_COMMA=$(printf "%'d" "${LOC}")
          ENCODED_LOC=$(echo "${LOC_COMMA}" | sed 's/,/%2C/g')

          # Download badge from Shields.io
          curl -fsS --retry 3 -o output/badge.svg "https://img.shields.io/badge/LoC-${ENCODED_LOC}-green"

      - name: Deploy to loc branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./output
          publish_branch: loc
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
