name: loc

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  loc_job:
    runs-on: ubuntu-latest
    name: Run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Calculate Lines of Code & Generate Badge
        run: |
          mkdir -p output
          
          # Count lines of code excluding ignored paths
          LOC=$(cloc . \
            --exclude-dir=node_modules,coverage,.github,.vscode,__scripts,__services,dist \
            --exclude-ext=md,txt \
            --not-match-f='package-lock.json|LICENSE|CITATION.cff|\.env|tsconfig\.tsbuildinfo' \
            --sum-one \
            | tail -n 1 \
            | awk '{print $5}')

          echo "Total Lines of Code: $LOC"

          # Download badge from Shields.io
          curl -fsS --retry 3 -o output/badge.svg "https://img.shields.io/badge/LoC-${LOC}-green"

      - name: Deploy to loc branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          publish_dir: ./output
          publish_branch: loc
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
