services:
  mongo:
    image: mongo:7.0.12 # Update mongo version if necessary
    command:
      - bash
      - -lc
      - rm -f /tmp/mongodb-keyfile && openssl rand -base64 756 > /tmp/mongodb-keyfile && chown mongodb:mongodb /tmp/mongodb-keyfile && chmod 400 /tmp/mongodb-keyfile && exec /usr/local/bin/docker-entrypoint.sh mongod --quiet --replSet rs0 --bind_ip_all --keyFile /tmp/mongodb-keyfile
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in the root .env file}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in the root .env file}"
    ports:
      - 127.0.0.1:27018:27017
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"try { rs.status().ok } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-express:
    profiles: ["db-tools"]
    image: mongo-express:latest
    restart: always
    ports:
      - 127.0.0.1:8084:8081
    environment:
      ME_CONFIG_MONGODB_URL: "${BC_DB_URI:?Set BC_DB_URI in the root .env file}"
      ME_CONFIG_BASICAUTH_USERNAME: "${MONGO_EXPRESS_USERNAME:?Set MONGO_EXPRESS_USERNAME in the root .env file}"
      ME_CONFIG_BASICAUTH_PASSWORD: "${MONGO_EXPRESS_PASSWORD:?Set MONGO_EXPRESS_PASSWORD in the root .env file}"
    depends_on:
      mongo:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - "${SAFARRENT_OLLAMA_MODELS_DIR:-D:/bookcars/.data/ollama-models}:/root/.ollama"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  safarrent-dev-api:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.dev
    env_file: ./backend/.env.docker
    restart: always
    ports:
      - "${SAFARRENT_BIND_ADDRESS:-127.0.0.1}:4002:4002"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - cdn:/var/www/cdn/bookcars
      - ./backend:/bookcars/backend
      - /bookcars/backend/node_modules
      - backend_logs:/bookcars/backend/logs
    environment:
      BC_DB_URI: "${BC_DB_URI:?Set BC_DB_URI in the root .env file}"
      BC_ADMIN_HOST: "http://${SAFARRENT_LAN_HOST:-localhost}:3001"
      BC_FRONTEND_HOST: "http://${SAFARRENT_LAN_HOST:-localhost}:8080"
      BC_AUTH_COOKIE_DOMAIN: ""
      NODE_ENV: development
      BC_AUTO_VERIFY_ON_SIGNUP: "true"
      BC_FYP_DEMO_MODE: "true"
      BC_AI_PROVIDER: ollama
      BC_OLLAMA_BASE_URL: http://ollama:11434
      BC_OLLAMA_MODEL: qwen3:0.6b
      BC_OLLAMA_TIMEOUT_MS: "120000"
      BC_AI_WARMUP_ON_START: "true"

  safarrent-dev-admin:
    build:
      context: .
      dockerfile: ./admin/Dockerfile.dev
    env_file: ./admin/.env.docker
    restart: always
    depends_on:
      - safarrent-dev-api
    ports:
      - "${SAFARRENT_BIND_ADDRESS:-127.0.0.1}:3001:3001"
    volumes:
      - ./admin:/bookcars/admin
      - /bookcars/admin/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_BC_API_HOST=http://${SAFARRENT_LAN_HOST:-localhost}:4002
      - VITE_BC_API_SAME_HOST=true
      - VITE_HMR_HOST=${SAFARRENT_LAN_HOST:-localhost}

  safarrent-dev-frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.dev
    env_file: ./frontend/.env.docker
    restart: always
    depends_on:
      - safarrent-dev-api
    ports:
      - "${SAFARRENT_BIND_ADDRESS:-127.0.0.1}:8080:8080"
      - "${SAFARRENT_BIND_ADDRESS:-127.0.0.1}:8443:443"
    volumes:
      - ./frontend:/bookcars/frontend
      - /bookcars/frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_BC_FYP_DEMO_MODE=true
      - VITE_BC_API_HOST=http://${SAFARRENT_LAN_HOST:-localhost}:4002
      - VITE_BC_API_SAME_HOST=true
      - VITE_BC_CDN_USERS=http://${SAFARRENT_LAN_HOST:-localhost}:4002/cdn/bookcars/users
      - VITE_BC_CDN_CARS=http://${SAFARRENT_LAN_HOST:-localhost}:4002/cdn/bookcars/cars
      - VITE_BC_CDN_LOCATIONS=http://${SAFARRENT_LAN_HOST:-localhost}:4002/cdn/bookcars/locations
      - VITE_BC_CDN_LICENSES=http://${SAFARRENT_LAN_HOST:-localhost}:4002/cdn/bookcars/licenses
      - VITE_BC_CDN_TEMP_LICENSES=http://${SAFARRENT_LAN_HOST:-localhost}:4002/cdn/bookcars/temp/licenses
      - VITE_HMR_HOST=${SAFARRENT_LAN_HOST:-localhost}

volumes:
  cdn:
  mongodb_data:
  mongodb_config:
  backend_logs:
  redis_data:
